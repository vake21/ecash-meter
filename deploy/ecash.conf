# eCash node config for eCash Meter — install at /etc/ecash/ecash.conf
#
# The daemon is `bitcoind` from the L1-ecash-bitcoin release (eCash's own build,
# based on Bitcoin Core 32.1). Its config file is named ecash.conf, not
# bitcoin.conf.
#
# ⚠ STOCK BITCOIN CORE WILL NOT WORK. eCash is a hard fork with its own
# consensus rules, network magic (eca5dcb7) and ports; a bitcoincore.org binary
# will not follow this chain. Get the node from releases.ecash.com — see
# deploy/README.md step 3 for the pinned version and checksum.
#
# eCash Meter only calls getblockchaininfo, getblockcount, getblockhash and
# getblock (verbosity 3). No wallet, no enforcer, no orchestrator.

# ECX mainnet. Default ports: P2P 8533, JSON-RPC 8532.
chain=main

# No wallet is ever needed: the site reads blocks and never signs anything.
# Dropping it removes the largest chunk of attack surface on a public host.
disablewallet=1

# Leave rpcbind/rpcallowip UNSET. The default binds RPC to localhost only, which
# is what we want — the indexer runs on this same box.
#
# Generate this line on the server (see deploy/README.md step 4) and put the
# plaintext password in /etc/ecashmeter/indexer.env, never here.
rpcauth=REPLACE_ME

# txindex is intentionally OFF. eCash Meter never calls getrawtransaction;
# getblock verbosity 3 sources per-tx fees and prevout values from block undo
# data instead. This saves the index entirely (and txindex is incompatible with
# pruning, below).

[main]
# ECX's DNS seed. The node needs only OUTBOUND access to reach it.
addnode=seed.ecash.ninja:8533

# ── Disk: read this before provisioning ─────────────────────────────────────
# ECX forks from Bitcoin's ledger at height 973,728, so a node validating from
# genesis needs Bitcoin's ENTIRE history — several hundred GB and growing. Two
# ways to avoid that:
#
#   1. assumeutxo (recommended). Start the node, then load eCash's published
#      UTXO snapshot at height 965,000 via the loadtxoutset RPC. The node is
#      usable at the tip within the hour while a second chainstate validates
#      history in the background. 965,000 is BELOW the fork, so every post-fork
#      block — all eCash Meter ever reads — is fully validated by the snapshot
#      chainstate. See deploy/README.md step 5.
#
#   2. prune. Bounds disk, but the background history sync still DOWNLOADS the
#      full chain, so bandwidth is unchanged. Uncomment and size generously:
#      verbosity-3 prevouts are unavailable for pruned blocks, so the prune
#      horizon caps how far back the store can ever be rebuilt. Keep it well
#      past WINDOW_DAYS (30).
# prune=100000
#
# ⚠ VERIFY, DON'T ASSUME: after the snapshot loads, confirm the node still
# serves what the indexer needs on a recent block —
#   bitcoin-cli -conf=/etc/ecash/ecash.conf getblock <recent-hash> 3
# must show a per-tx "fee" and "vin[].prevout.value". If it does not, the
# indexer will silently attribute 0 sats to every bid.

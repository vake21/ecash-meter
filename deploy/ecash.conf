# eCash node config for eCash Meter — install at /etc/ecash/ecash.conf
#
# The daemon is `bitcoind` from the L1-ecash-bitcoin release (eCash's own build,
# based on Bitcoin Core 32.1). Its config file is named ecash.conf, not
# bitcoin.conf.
#
# ⚠ STOCK BITCOIN CORE WILL NOT WORK. eCash is a hard fork with its own
# consensus rules, network magic (eca5dcb7) and ports; a bitcoincore.org binary
# will not follow this chain. Get the node from releases.ecash.com — see
# deploy/README.md step 3 for the pinned version and checksum.
#
# eCash Meter only calls getblockchaininfo, getblockcount, getblockhash and
# getblock (verbosity 3). No wallet, no enforcer, no orchestrator.

# ECX mainnet. Default ports: P2P 8533, JSON-RPC 8532.
chain=main

# No wallet is ever needed: the site reads blocks and never signs anything.
# Dropping it removes the largest chunk of attack surface on a public host.
disablewallet=1

# Leave rpcbind/rpcallowip UNSET. The default binds RPC to localhost only, which
# is what we want — the indexer runs on this same box.
#
# Generate this line on the server (see deploy/README.md step 4) and put the
# plaintext password in /etc/ecashmeter/indexer.env, never here.
rpcauth=REPLACE_ME

# txindex is intentionally OFF. eCash Meter never calls getrawtransaction;
# getblock verbosity 3 sources per-tx fees and prevout values from block undo
# data instead. This saves the index entirely (and txindex is incompatible with
# pruning, below).

[main]
# ECX's DNS seed. The node needs only OUTBOUND access to reach it.
addnode=seed.ecash.ninja:8533

# ── Disk: pruning, and why it is safe here ──────────────────────────────────
# ECX forks from Bitcoin's ledger at height 973,728, so a node validating from
# genesis needs every Bitcoin block ever mined — several hundred GB and growing.
# Pruning bounds that, and eCash Meter is a workload where pruning costs almost
# nothing:
#
#   - The site reads a ROLLING RECENT WINDOW only (WINDOW_DAYS = 30, ~4,320
#     blocks), and the indexer fetches only blocks newer than its stored tip. It
#     never asks for an old block.
#   - It does NOT run the bip300301-enforcer, which is what actually breaks under
#     pruning ("Block not available") on a BitWindow-style full node.
#
# What pruning DOES cost: the prune horizon caps how far back the store can ever
# be REBUILT, because verbosity-3 prevouts are unavailable for pruned blocks. The
# SQLite store therefore stops being a throwaway derived cache — see the backup
# note in deploy/README.md. Back it up.
prune=40000

# Budget for an 80 GB disk:
#   ~12-15 GB  chainstate (~165.7M UTXOs)
#   ~10 GB     OS, Node, the Next build, swap
#    40 GB     blocks + undo at the prune target above
#   ~15 GB     headroom
# MEASURED against ECX on 2026-11-02, not assumed: the chain was producing
# ~614 blocks/day (141 s/block) averaging 0.61 MB, so ~0.4 GB/day of block data.
# 40 GB therefore holds ~107 days against a 30-day window. Note ECX is faster
# than Bitcoin because the fork reset difficulty, and the rate is still falling
# as difficulty settles — so this horizon only grows. Re-measure if you shorten
# the prune target:
#   bitcoin-cli getblockstats <height>   # or compare getblockheader times
#
# Note the initial sync still DOWNLOADS the whole chain (pruning deletes as it
# goes), so budget the bandwidth, not the disk. Hetzner includes 20 TB.
#
# Deliberately NOT using the assumeutxo snapshot. It would only shorten
# time-to-usable, not the download, and it adds an untested interaction with
# pruning. eCash's published mainnet snapshot is also unusable as of 2026-11-01:
# its header carries Bitcoin's network magic (f9beb4d9) instead of eCash's
# (eca5dcb7), so the daemon rejects it. A plain pruned sync from genesis is the
# well-trodden path and needs no babysitting.
#
# assumevalid is deliberately left UNSET so the shipped default applies (block
# 966,143, which is pre-fork and on ECX's chain). That skips script verification
# for everything below it and makes the initial sync dramatically faster. Do not
# set assumevalid=0 here — BitWindow does that on desktop, and it forces full
# signature checks on ~965,000 blocks.
